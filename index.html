<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio - Ju Hong Kim</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar no-print">
    <div class="nav-container">
      <a href="#about" class="brand">Ju Hong Kim (zakuArbor)</a>
      <nav>
        <a href="#about">About</a>
        <a href="#skills">Skills</a>
        <a href="#experience">Experience</a>
        <a href="#projects">Projects</a>
        <a href="#education">Education</a>
      </nav>
    </div>
  </header>

  <main class="container">
    
    <section id="about" class="section">
      <h1 id="user-name">Loading...</h1>
      <p id="user-tagline" class="tagline"></p>
      <p id="user-about" class="bio"></p>
      <div id="user-links" class="links-container no-print"></div>
    </section>

    <section id="skills" class="section">
      <h2>Skills</h2>
      <div id="skills-list" class="grid-2"></div>
    </section>

    <section id="experience" class="section">
      <h2>Experience</h2>
      <div id="experience-list" class="timeline"></div>
    </section>

    <section id="projects" class="section">
      <h2>Projects</h2>
      <div id="projects-list" class="grid-2"></div>
    </section>

    <section id="education" class="section">
      <h2>Education</h2>
      <div id="education-list"></div>
    </section>

  </main>

  <footer class="footer no-print">
    <p>&copy; <span id="year"></span> Ju Hong Kim</p>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
